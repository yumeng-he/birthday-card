<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A little birthday card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--ink:#514657;--rose:#f5bfd1}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;color:var(--ink);font-family:Manrope,sans-serif;background:#fdf8f6}button,input{font:inherit}.scene{position:fixed;inset:0;display:grid;place-items:center;padding:26px;overflow:hidden;transition:opacity .65s ease,visibility .65s ease}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 14%,#fff,transparent 22%),radial-gradient(circle at 87% 86%,#caebe3b8,transparent 27%),linear-gradient(135deg,#fbeaf0,#fcf8ed 51%,#e8f3fb)}#welcome{z-index:2}#cardScene{z-index:3;opacity:0;visibility:hidden;pointer-events:none}#cardScene.active{opacity:1;visibility:visible;pointer-events:auto}#welcome.leaving{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.025)}.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}.sparkle{position:absolute;color:#fff;filter:drop-shadow(0 1px 2px #7e60862e);animation:twinkle var(--speed) ease-in-out infinite}@keyframes twinkle{50%{opacity:.25;transform:scale(.55) rotate(22deg)}}.balloon{position:absolute;bottom:-150px;width:var(--size);height:calc(var(--size)*1.2);border-radius:50% 50% 47% 47%;background:var(--balloon);box-shadow:inset -13px -10px #684c6714,inset 10px 12px #ffffff6b;opacity:.82;animation:floatUp var(--duration) linear infinite;animation-delay:var(--delay)}.balloon:before{content:"";position:absolute;bottom:-8px;left:calc(50% - 7px);border:7px solid transparent;border-top:10px solid var(--balloon)}.balloon:after{content:"";position:absolute;left:50%;top:100%;height:88px;border-left:1px solid #5343544d;transform:rotate(5deg)}@keyframes floatUp{0%{transform:translate(0,0) rotate(-3deg)}40%{transform:translate(22px,-46vh) rotate(3deg)}75%{transform:translate(-14px,-89vh) rotate(-2deg)}100%{transform:translate(18px,-128vh) rotate(3deg)}}.ribbon{position:absolute;top:-90px;width:9px;height:50px;border-radius:8px;background:var(--ribbon);opacity:.72;animation:ribbonFall var(--rd) linear infinite;animation-delay:var(--rdel)}@keyframes ribbonFall{0%{transform:translate(0) rotate(-20deg) skewY(10deg)}25%{transform:translate(18px,28vh) rotate(75deg) skewY(-15deg)}55%{transform:translate(-18px,58vh) rotate(150deg) skewY(12deg)}100%{transform:translate(10px,115vh) rotate(295deg) skewY(-10deg)}}.intro{position:relative;z-index:1;width:min(610px,100%);text-align:center;padding:clamp(32px,6vw,58px) clamp(24px,6vw,66px);border:1px solid #ffffffb8;border-radius:34px;background:#ffffff75;box-shadow:0 24px 70px #835d7721,inset 0 1px #fff;backdrop-filter:blur(13px);animation:introIn .9s cubic-bezier(.2,.8,.2,1) both}@keyframes introIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}.mini{color:#c78bb1;font-size:1.2rem;letter-spacing:.52em;margin-left:.52em}.intro h1{margin:17px 0 12px;font:500 clamp(2.5rem,8vw,4.9rem)/.99 "DM Serif Display",serif;letter-spacing:-.045em}.intro h1 em{color:#df7f9e}.intro p{max-width:370px;margin:0 auto 29px;font-size:1rem;line-height:1.75;color:#74687a}.name-form{display:flex;gap:10px;max-width:438px;margin:auto}.name-form input{min-width:0;flex:1;border:1px solid #ead7df;border-radius:15px;padding:15px 17px;outline:0;color:var(--ink);background:#ffffffe3;box-shadow:0 5px 16px #69465c0f}.name-form input:focus{border-color:#e5a0bb;box-shadow:0 5px 18px #de82a229}.name-form button,.save{border:0;cursor:pointer;border-radius:15px;color:#fff;background:#dd82a3;box-shadow:0 5px 0 #c96c8e;font-weight:700;transition:.16s}.name-form button{padding:0 19px;white-space:nowrap}.name-form button:hover,.save:hover{transform:translateY(-2px);box-shadow:0 7px 0 #c96c8e}.hint{min-height:19px;margin:13px 0 0!important;font-size:.78rem!important;color:#bc6e8b!important;opacity:0}.hint.show{opacity:1}#cardScene:before{background:radial-gradient(circle at 50% 46%,#ffffffef,transparent 25%),radial-gradient(circle at 8% 84%,var(--accent,#deebfa),transparent 32%),linear-gradient(145deg,#fff8f5,#f7f4fc 50%,#edf8f4)}.card-wrap{position:relative;z-index:2;display:grid;justify-items:center;gap:23px;width:100%}.card{position:relative;display:grid;place-items:center;isolation:isolate;width:min(630px,92vw);aspect-ratio:1.35/1;overflow:hidden;padding:42px;border:1px solid #ffffffd9;border-radius:30px;background:var(--bg,#fff1f5);box-shadow:0 25px 70px #5f486930,inset 0 1px #fff;animation:cardArrive .85s cubic-bezier(.18,.85,.28,1.18) both}.card:before{content:"";position:absolute;inset:13px;border:1px solid var(--line,#eac7d6);border-radius:21px;opacity:.74;z-index:-1}.card:after{content:"";position:absolute;width:240px;height:240px;top:-110px;right:-80px;border-radius:50%;background:var(--orb,#f7c6da);opacity:.5;z-index:-2}@keyframes cardArrive{from{opacity:0;transform:translateY(28px) scale(.84) rotate(-1.5deg)}to{opacity:1;transform:none}}.glow{position:absolute;left:-60px;bottom:-100px;width:245px;height:245px;border-radius:50%;background:var(--glow,#c5e8e0);opacity:.55}.message{position:relative;z-index:2;max-width:520px;text-align:center;font:500 clamp(2.55rem,8.2vw,5.4rem)/1.02 var(--font,"DM Serif Display"),serif;letter-spacing:-.055em;color:var(--cink,#5b485b);text-wrap:balance}.decor{position:absolute;z-index:1}.flower{width:35px;height:35px;border-radius:50%;background:var(--petal);box-shadow:18px 0 var(--petal),9px 15px var(--petal),9px -15px var(--petal),9px 0 #ffe7a8}.star{color:var(--star);font-size:var(--ss);animation:twinkle 2.5s ease-in-out infinite}.dballoon{width:var(--ds);height:calc(var(--ds)*1.23);border-radius:50% 50% 47% 47%;background:var(--db);box-shadow:inset -7px -7px #4a415816,inset 7px 7px #ffffff61}.dballoon:after{content:"";position:absolute;left:50%;top:100%;height:39px;border-left:1px solid #45374b4d;transform:rotate(9deg)}.save{padding:14px 22px;font-size:.95rem}.save[disabled]{cursor:wait;opacity:.72}@media(max-width:560px){.scene{padding:18px}.intro{border-radius:27px}.name-form{flex-direction:column}.name-form button{min-height:51px}.card{padding:28px 25px;border-radius:25px}.message{font-size:clamp(2.3rem,12.5vw,4.1rem)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<section class="scene" id="welcome"><div class="sky" id="welcomeSky"></div><div class="intro"><div class="mini">✦ ✧ ✦</div><h1>Today is all about <em>you.</em></h1><p>Someone special deserves a soft, sparkly little celebration.</p><form class="name-form" id="nameForm"><input id="nameInput" maxlength="28" autocomplete="off" placeholder="Enter the birthday person's name" aria-label="Birthday person's name"><button>Open the Card ✨</button></form><p class="hint" id="hint">Please add a name to open the card.</p></div></section>
<section class="scene" id="cardScene" aria-hidden="true"><div class="sky" id="cardSky"></div><div class="card-wrap"><article class="card" id="card"><div class="glow"></div><div class="message" id="message"></div></article><button class="save" id="save">Save Card</button></div></section>
<script>
const palettes=[['#fff0f4','#5a4555','#e8b9ca','#f7c0d5','#c5e9df','#e5f2fb','#eca5c0','#d590b2','#d5c8ef','"DM Serif Display"'],['#f0f5ff','#49556c','#c5d8ee','#c8ddf5','#d4efdf','#f7dde8','#a8c8e9','#8caed1','#f0c5d7','"Playfair Display"'],['#f6f0ff','#564b68','#d9c9ef','#ded0f4','#d0e9df','#fff0d9','#c8ace5','#ad8bcf','#f3ca9e','"DM Serif Display"'],['#effaf5','#405c56','#bfe2d3','#bfe9dc','#d4e4f7','#f8e2eb','#9ecfbf','#76ad9b','#f3c4d7','"Playfair Display"']];
const colors=['#f3bbd0','#c9e3f2','#d8cdf2','#c6e7d9','#f6d49b'];function ambient(sky,n){for(let i=0;i<n;i++){let e=document.createElement('i'),t=i%3;e.className=t===0?'ribbon':t===1?'balloon':'sparkle';e.style.left=Math.random()*100+'%';if(t===1){e.style.setProperty('--size',30+Math.random()*40+'px');e.style.setProperty('--balloon',colors[i%5]);e.style.setProperty('--duration',16+Math.random()*14+'s');e.style.setProperty('--delay',-Math.random()*25+'s')}else if(t===0){e.style.setProperty('--ribbon',colors[i%5]);e.style.setProperty('--rd',9+Math.random()*8+'s');e.style.setProperty('--rdel',-Math.random()*13+'s')}else{e.textContent='✦';e.style.top=Math.random()*100+'%';e.style.fontSize=9+Math.random()*13+'px';e.style.setProperty('--speed',2+Math.random()*3+'s');e.style.animationDelay=-Math.random()*4+'s'}sky.append(e)}}ambient(welcomeSky,33);ambient(cardSky,20);
function decorate(p){let c=card;c.querySelectorAll('.decor').forEach(x=>x.remove());['--bg','--cink','--line','--orb','--glow','--accent','--petal','--star','--db','--font'].forEach((k,i)=>c.style.setProperty(k,p[i]));for(let i=0;i<8;i++){let e=document.createElement('i'),t=['flower','star','dballoon'][Math.floor(Math.random()*3)];e.className='decor '+t;e.style.left=5+Math.random()*87+'%';e.style.top=6+Math.random()*82+'%';if(t==='star'){e.textContent='✦';e.style.setProperty('--ss',15+Math.random()*20+'px')}if(t==='dballoon')e.style.setProperty('--ds',30+Math.random()*25+'px');c.append(e)}}
nameForm.onsubmit=e=>{e.preventDefault();let n=nameInput.value.replace(/[<>]/g,'').trim();if(!n){hint.classList.add('show');return}decorate(palettes[Math.floor(Math.random()*palettes.length)]);message.textContent='Happy Birthday, '+n+'!';welcome.classList.add('leaving');cardScene.classList.add('active');cardScene.setAttribute('aria-hidden','false')};
save.onclick=async()=>{if(!window.html2canvas){alert('Saving is unavailable right now. Please try again when you are online.');return}save.disabled=true;save.textContent='Saving…';try{let canvas=await html2canvas(card,{scale:2,useCORS:true,backgroundColor:null}),a=document.createElement('a');a.download='birthday-card.png';a.href=canvas.toDataURL('image/png');a.click()}catch(e){alert('Sorry, the card could not be saved. Please try again.')}finally{save.disabled=false;save.textContent='Save Card'}};
</script></body></html>
